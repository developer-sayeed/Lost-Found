    <script>
      // Disable verbose Workbox dev logs
      try {
        window.__WB_DISABLE_DEV_LOGS = true;
        self.__WB_DISABLE_DEV_LOGS = true;
      } catch (e) {}

      // Provide a calm, resilient WebSocket shim for Vite HMR in cloud preview environments
      (function() {
        var OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          function MockViteWebSocket(url, protocols) {
            var isViteHmr = false;
            if (typeof protocols === 'string' && protocols.indexOf('vite-hmr') !== -1) isViteHmr = true;
            if (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) isViteHmr = true;
            if (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite-hmr') !== -1)) isViteHmr = true;

            if (!isViteHmr) {
              return new OriginalWebSocket(url, protocols);
            }

            var target = new EventTarget();
            target.readyState = 1; // WebSocket.OPEN
            target.OPEN = 1;
            target.CLOSED = 3;
            target.send = function() {};
            target.close = function() {
              target.readyState = 3;
              target.dispatchEvent(new Event('close'));
            };
            return target;
          }

          MockViteWebSocket.prototype = OriginalWebSocket.prototype;
          MockViteWebSocket.CONNECTING = 0;
          MockViteWebSocket.OPEN = 1;
          MockViteWebSocket.CLOSING = 2;
          MockViteWebSocket.CLOSED = 3;

          window.WebSocket = MockViteWebSocket;
        }

        // Suppress benign Vite websocket and noisy Workbox logs in console
        var isNoisy = function(val) {
          if (!val) return false;
          var str = typeof val === 'string' ? val : (val.message || val.stack || '');
          if (typeof str !== 'string') return false;
          var lower = str.toLowerCase();
          return lower.indexOf('[vite] failed to connect to websocket') !== -1 ||
                 lower.indexOf('[vite] connecting...') !== -1 ||
                 lower.indexOf('[vite]') !== -1 ||
                 lower.indexOf('workbox') !== -1 ||
                 lower.indexOf('[workbox]') !== -1;
        };

        ['log', 'debug', 'info', 'warn', 'error', 'group', 'groupCollapsed'].forEach(function(method) {
          var orig = console[method];
          if (!orig) return;
          console[method] = function() {
            for (var i = 0; i < arguments.length; i++) {
              if (isNoisy(arguments[i])) {
                return;
              }
            }
            orig.apply(console, arguments);
          };
        });

        window.addEventListener('unhandledrejection', function(event) {
          if (event && isNoisy(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });

        window.addEventListener('error', function(event) {
          if (event && (isNoisy(event.message) || isNoisy(event.error))) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
      })();
    </script>
