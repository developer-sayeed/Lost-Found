<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b2e" />
      <stop offset="50%" stop-color="#2d1222" />
      <stop offset="100%" stop-color="#0f0d17" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="100%" stop-color="#fda085" />
    </linearGradient>
    <linearGradient id="luxuryGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae08c" />
      <stop offset="40%" stop-color="#dfb76c" />
      <stop offset="100%" stop-color="#9a7432" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  
  <!-- Subtle inner border -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="url(#luxuryGold)" stroke-width="3" stroke-opacity="0.4" />

  <!-- Shield / Crest Badge -->
  <path d="M256 90 L370 140 C370 260 256 340 256 340 C256 340 142 260 142 140 Z" fill="#1b1528" stroke="url(#luxuryGold)" stroke-width="8" filter="url(#glow)"/>

  <!-- Warwick Monogram W -->
  <path d="M190 170 L215 260 L240 200 L256 200 L272 200 L297 260 L322 170" fill="none" stroke="url(#luxuryGold)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Lost & Found Key / Tag accent -->
  <g transform="translate(256, 360) scale(1.1)">
    <circle cx="-16" cy="0" r="14" fill="none" stroke="url(#luxuryGold)" stroke-width="5" />
    <path d="M-2 0 L24 0 M12 0 L12 8 M20 0 L20 6" stroke="url(#luxuryGold)" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Hotel Brand text -->
  <text x="256" y="440" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', serif" font-size="28" font-weight="700" letter-spacing="6" fill="#f5eedc">WARWICK</text>
  <text x="256" y="468" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#dfb76c">LOST &amp; FOUND</text>
</svg>
