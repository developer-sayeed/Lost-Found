<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b2e" />
      <stop offset="50%" stop-color="#2d1222" />
      <stop offset="100%" stop-color="#0f0d17" />
    </linearGradient>
    <linearGradient id="luxuryGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae08c" />
      <stop offset="40%" stop-color="#dfb76c" />
      <stop offset="100%" stop-color="#9a7432" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed background for maskable -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <g transform="translate(256, 256) scale(0.78) translate(-256, -256)">
    <!-- Shield / Crest Badge -->
    <path d="M256 70 L380 125 C380 265 256 355 256 355 C256 355 132 265 132 125 Z" fill="#1b1528" stroke="url(#luxuryGold)" stroke-width="10" filter="url(#glow)"/>

    <!-- Warwick Monogram W -->
    <path d="M185 160 L212 265 L242 195 L256 195 L270 195 L300 265 L327 160" fill="none" stroke="url(#luxuryGold)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Lost & Found Key / Tag accent -->
    <g transform="translate(256, 375) scale(1.2)">
      <circle cx="-16" cy="0" r="14" fill="none" stroke="url(#luxuryGold)" stroke-width="6" />
      <path d="M-2 0 L24 0 M12 0 L12 8 M20 0 L20 6" stroke="url(#luxuryGold)" stroke-width="6" stroke-linecap="round" />
    </g>

    <!-- Hotel Brand text -->
    <text x="256" y="445" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', serif" font-size="32" font-weight="700" letter-spacing="6" fill="#f5eedc">WARWICK</text>
    <text x="256" y="475" text-anchor="middle" font-family="'Inter', sans-serif" font-size="16" font-weight="600" letter-spacing="4" fill="#dfb76c">LOST &amp; FOUND</text>
  </g>
</svg>
